<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <h2>New Course</h2>
    <form action="/app/createCourse" method="POST">
        <p><input type="text" name="course-name" placeholder="Course name" required></p>
        <p>Start: <input type="time" name="start-time" required></p>
        <p>End: <input type="time" name="end-time" required></p>
        <p>
            <label><input type="checkbox" name="day-mon" value="1"> Mon</label>
            <label><input type="checkbox" name="day-tue" value="1"> Tue</label>
            <label><input type="checkbox" name="day-wed" value="1"> Wed</label>
            <label><input type="checkbox" name="day-thu" value="1"> Thu</label>
            <label><input type="checkbox" name="day-fri" value="1"> Fri</label>
        </p>
        <p><button type="submit">Create Course</button></p>
    </form>
    <hr>
</div>
</body>
</html>
