<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <h2>Upload QR Code</h2>
    <form action="/app/createQRCodeUpload" method="POST" enctype="multipart/form-data">
        <p><input type="file" name="imageUpload" accept="image/*" required></p>
        <p><button type="submit">Upload</button></p>
    </form>
    <hr>
</div>
</body>
</html>
